<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Mathematics Lecture Portal</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #020617;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --success: #22c55e;
            --border: #334155;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .layout-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (min-width: 1024px) {
            .layout-grid {
                grid-template-columns: 3fr 1fr;
            }
        }

        .card {
            background-color: var(--bg-card);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        h1 {
            color: var(--accent);
            margin-top: 0;
            font-size: 26px;
            text-align: center;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (min-width: 640px) {
            .controls {
                grid-template-columns: 1fr 1fr;
            }
        }

        .select-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        select {
            padding: 12px;
            font-size: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--bg-input);
            color: var(--text-main);
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: var(--accent);
        }

        select:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-section {
            background-color: var(--bg-input);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
        }

        .progress-bar-container {
            background-color: #334155;
            border-radius: 9999px;
            height: 10px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar-fill {
            background-color: var(--success);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-stats {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text-muted);
        }

        .video-box {
            display: none;
            background-color: var(--bg-input);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            text-align: center;
        }

        .video-meta {
            text-align: left;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .badge {
            background-color: var(--accent);
            color: #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .lecture-title {
            font-size: 18px;
            font-weight: 600;
            margin-top: 5px;
        }

        video {
            width: 100%;
            border-radius: 8px;
            background: #000;
        }

        .action-bar {
            margin-top: 15px;
            display: flex;
            justify-content: flex-start;
            gap: 10px;
        }

        button {
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .btn-success {
            background-color: var(--success);
            color: white;
        }

        .btn-accent {
            background-color: var(--accent);
            color: #000;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .log-box {
            max-height: 400px;
            overflow-y: auto;
            background-color: var(--bg-input);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 13px;
        }

        .log-entry {
            padding: 8px;
            border-bottom: 1px solid #1e293b;
            color: var(--text-muted);
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-time {
            color: var(--accent);
            font-family: monospace;
        }

        option.watched-opt {
            color: #4ade80 !important;
            font-weight: bold;
        }
    </style>
</head>

            <div class="action-bar">

        </div>
    </main>

</div>

let watchedSet = new Set(JSON.parse(localStorage.getItem('mathPortalWatched')) || []);
let currentVideoId = null;

const levelSelect = document.getElementById('levelSelect');
const lectureSelect = document.getElementById('lectureSelect');
const videoBox = document.getElementById('videoBox');
const mainPlayer = document.getElementById('mainPlayer');
const logBox = document.getElementById('logBox');
const metaTopic = document.getElementById('metaTopic');
const metaTitle = document.getElementById('metaTitle');
const btnWatched = document.getElementById('btnWatched');

function logActivity(text) {
    const timestamp = new Date().toLocaleTimeString();
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `<span class="log-time">[${timestamp}]</span> ${text}`;
    if (logBox.innerText.includes("No activities recorded")) logBox.innerHTML = '';
    logBox.insertBefore(entry, logBox.firstChild);
}

function updateProgressBars() {
    const total = lectureData.length;
    const watchedCount = watchedSet.size;
    const totalPct = Math.round((watchedCount / total) * 100) || 0;
    
    document.getElementById('progressText').textContent = `Total Progress: ${watchedCount}/${total} Videos (${totalPct}%)`;
    document.getElementById('progressBar').style.width = `${totalPct}%`;

    const selectedLevel = levelSelect.value;
    if(selectedLevel) {
        const lvlLectures = lectureData.filter(item => item.level === selectedLevel);
        const lvlWatched = lvlLectures.filter(item => watchedSet.has(item.id)).length;
        const lvlPct = Math.round((lvlWatched / lvlLectures.length) * 100) || 0;
        document.getElementById('levelProgressText').textContent = `${selectedLevel}: ${lvlWatched}/${lvlLectures.length} (${lvlPct}%)`;
    } else {
        document.getElementById('levelProgressText').textContent = 'Level Progress: --';
    }
}

// Populate level dropdown
const uniqueLevels = [...new Set(lectureData.map(item => item.level))];
uniqueLevels.forEach(lvl => {
    let opt = document.createElement('option');
    opt.value = lvl;
    opt.textContent = lvl;
    levelSelect.appendChild(opt);
});

levelSelect.addEventListener('change', function() {
    lectureSelect.innerHTML = '<option value="">-- Select a Lecture --</option>';
    videoBox.style.display = 'none';
    mainPlayer.pause();
    
    if(!this.value) {
        lectureSelect.disabled = true;
        updateProgressBars();
        return;
    }
    
    const filtered = lectureData.filter(item => item.level === this.value);
    filtered.forEach(lec => {
        let opt = document.createElement('option');
        opt.value = `https://docs.google.com/uc?export=download&id=${lec.id}`;
        opt.textContent = (watchedSet.has(lec.id) ? '✓ ' : '○ ') + lec.title;
        opt.setAttribute('data-id', lec.id);
        opt.setAttribute('data-topic', lec.topic);
        opt.setAttribute('data-title', lec.title);
        if(watchedSet.has(lec.id)) opt.classList.add('watched-opt');
        lectureSelect.appendChild(opt);
    });
    
    lectureSelect.disabled = false;
    updateProgressBars();
});

lectureSelect.addEventListener('change', function() {
    if(!this.value) {
        videoBox.style.display = 'none';
        mainPlayer.pause();
        currentVideoId = null;
        return;
    }
    
    const sel = lectureSelect.options[lectureSelect.selectedIndex];
    currentVideoId = sel.getAttribute('data-id');
    metaTopic.textContent = sel.getAttribute('data-topic');
    metaTitle.textContent = sel.getAttribute('data-title');
    
    mainPlayer.src = this.value;
    videoBox.style.display = 'block';
    mainPlayer.load();
    
    logActivity(`Started playing: <strong>${sel.getAttribute('data-title')}</strong>`);
});

btnWatched.addEventListener('click', function() {
    if(!currentVideoId) return;
    
    const sel = lectureSelect.options[lectureSelect.selectedIndex];
    const lectureTitle = sel.getAttribute('data-title');
    
    if(watchedSet.has(currentVideoId)) {
        watchedSet.delete(currentVideoId);
        sel.textContent = '○ ' + lectureTitle;
        sel.classList.remove('watched-opt');
        logActivity(`Marked incomplete: <strong>${lectureTitle}</strong>`);
    } else {
        watchedSet.add(currentVideoId);
        sel.textContent = '✓ ' + lectureTitle;
        sel.classList.add('watched-opt');
        logActivity(`Completed video: <strong>${lectureTitle}</strong>`);
    }
    
    localStorage.setItem('mathPortalWatched', JSON.stringify([...watchedSet]));
    updateProgressBars();
});

// Auto track continuous complete triggers
mainPlayer.addEventListener('ended', function() {
    if(currentVideoId && !watchedSet.has(currentVideoId)) {
        btnWatched.click();
    }
});

updateProgressBars();
</script>
